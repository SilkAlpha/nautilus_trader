[package]
name = "nautilus-bitget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Bitget exchange integration adapter for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_bitget"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
arrow = ["dep:arrow", "nautilus-serialization"]
examples = [
  "nautilus-live/node",
  "nautilus-network/transport-sockudo",
  "nautilus-trading/examples",
]
python = [
  "dep:nautilus-system",
  "nautilus-common/python",
  "nautilus-core/python",
  "nautilus-live/python",
  "nautilus-model/python",
  "nautilus-network/python",
  "nautilus-system/python",
  "pyo3",
  "pyo3-async-runtimes",
  "pyo3-stub-gen",
]
extension-module = [
  "nautilus-common/extension-module",
  "nautilus-core/extension-module",
  "nautilus-live/extension-module",
  "nautilus-model/extension-module",
  "nautilus-network/extension-module",
  "python",
  "pyo3/extension-module",
]
high-precision = [
  "nautilus-model/high-precision",
  "nautilus-serialization?/high-precision",
]

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["arrow", "examples", "high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core = { workspace = true }
nautilus-live = { workspace = true }
nautilus-model = { workspace = true }
nautilus-network = { workspace = true, features = ["transport-sockudo"] }
nautilus-serialization = { workspace = true, features = [
  "arrow",
], optional = true }
nautilus-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bon = { workspace = true }
dashmap = { workspace = true }
derive_builder = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_repr = { workspace = true }
serde_urlencoded = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

arrow = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nautilus-live = { workspace = true, features = ["test-support"] }
nautilus-persistence = { workspace = true }
nautilus-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
nautilus-trading = { workspace = true }

axum = { workspace = true }
criterion = { workspace = true }
rstest = { workspace = true }
rust_decimal_macros = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
toml = { workspace = true }

# Run with `cargo bench -p nautilus-bitget --bench websocket`
[[bench]]
name = "websocket"
harness = false

[[bench]]
name = "market_data"
harness = false

# Run with `cargo run -p nautilus-bitget --bin bitget-http`.
[[bin]]
name = "bitget-http"
path = "bin/http.rs"
doc = false
test = false

# Run with `cargo run -p nautilus-bitget --bin bitget-ws-data`.
[[bin]]
name = "bitget-ws-data"
path = "bin/ws_data.rs"
doc = false
test = false

# Run with `cargo run -p nautilus-bitget --bin bitget-flatten`.
[[bin]]
name = "bitget-flatten"
path = "bin/flatten.rs"
doc = false
test = false

# Run with `cargo run --example bitget-data-tester --package nautilus-bitget --features examples`.
[[example]]
name = "bitget-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example bitget-exec-tester --package nautilus-bitget --features examples`.
[[example]]
name = "bitget-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example bitget-greeks-tester --package nautilus-bitget --features examples`.
[[example]]
name = "bitget-greeks-tester"
path = "examples/node_greeks.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example bitget-option-chain --package nautilus-bitget --features examples`.
[[example]]
name = "bitget-option-chain"
path = "examples/node_option_chain.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example bitget-delta-neutral --package nautilus-bitget --features examples`.
[[example]]
name = "bitget-delta-neutral"
path = "examples/node_delta_neutral.rs"
required-features = ["examples"]
doc = false

# Public market-data validation; explicitly connects to Bitget mainnet.
# Run with `cargo test --package nautilus-bitget --features examples --test bitget-book-stress -- --timeout 10 --rounds 21`
[[test]]
name = "bitget-book-stress"
path = "tests/stress/book_stress.rs"
harness = false
test = false
required-features = ["examples"]
